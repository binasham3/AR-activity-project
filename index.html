<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Themed AR Project</title>
 
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
 
  <script>
    // Tappable colour-changing ball 
    AFRAME.registerComponent('color-changer', {
      init: function () {
        const colors = ['#EF2D5E', '#FFC65D', '#4CC3D9', '#7BC8A4', '#9B59B6'];
        let index = 0;
        this.el.addEventListener('click', () => {
          index = (index + 1) % colors.length;
          this.el.setAttribute('color', colors[index]);
        });
      }
    });

    // Tappable growing/scaling cylinder 
    AFRAME.registerComponent('size-grower', {
      init: function () {
        let isBig = false;
        this.el.addEventListener('click', () => {
          isBig = !isBig;
          if (isBig) {
            this.el.setAttribute('scale', '2 2 2');
          } else {
            this.el.setAttribute('scale', '1 1 1');
          }
        });
      }
    });
 
    // Marker status detector 
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.querySelector('#status');
        this.el.addEventListener('markerFound', () => {
          banner.textContent = 'Marker FOUND - Tap the shapes!';
          banner.style.background = '#2E7D32';
        });
        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Marker LOST - Point camera at Hiro marker';
          banner.style.background = '#C62828';
        });
      }
    });
  </script>
 
  <style>
    body { margin: 0; overflow: hidden; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      padding: 10px; text-align: center; color: white;
      font-family: sans-serif; background: #C62828;
      font-weight: bold; font-size: 16px;
    }
  </style>
</head>
 
<body>

  //Status Banner
  <div id="status">Looking for marker...</div>
 
  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">
 
    <a-assets timeout="20000">


      // model sample
      <a-asset-item id="item-model"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/AntiqueCamera/glTF-Binary/AntiqueCamera.glb">
      </a-asset-item>
    </a-assets>
 
    <a-marker preset="hiro" marker-status>
 
      // Ground plate 
      <a-plane rotation="-90 0 0" width="1.6" height="1.6"
               color="#2C3E50"></a-plane>
 
      // 1. 3D Model with rotation animation
      <a-entity gltf-model="#item-model" position="0 0 0" scale="0.08 0.08 0.08"
                animation="property: rotation; to: 0 360 0;
                           dur: 10000; easing: linear; loop: true"></a-entity>
 
      // 2. Tappable & bouncing sphere (Primitive 1)
      <a-sphere class="clickable" color-changer
                position="-0.5 0.4 0" radius="0.18" color="#EF2D5E"
                animation="property: position; from: -0.5 0.3 0; to: -0.5 0.6 0;
                           dir: alternate; dur: 700;
                           easing: easeInOutQuad; loop: true"></a-sphere>

      // 3. Tappable growing cylinder (Primitive 2)
      <a-cylinder class="clickable" size-grower
                  position="0.5 0.25 0" radius="0.15" height="0.5"
                  color="#FFC65D"></a-cylinder>
 
      // 4. Text Label
      <a-text value="Interactive AR Exhibit" position="0 1.3 0" align="center"
              width="3" color="#FFFFFF"></a-text>
    </a-marker>
 
    // Camera with raycaster for tap/click events
    <a-entity camera
              cursor="rayOrigin: mouse"
              raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
